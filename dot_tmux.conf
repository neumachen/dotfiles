# vim: ft=tmux

#-------------------------------------------------------------------------------
#   TMUX CONFIG
#-------------------------------------------------------------------------------
# tmux's *internal* terminal type should be a tmux-* entry, not the outer
# terminal's $TERM. With WezTerm now exporting TERM=wezterm, inheriting it via
# "${TERM}" would feed tmux a non-tmux entry. Pin tmux-256color internally and
# advertise RGB (truecolor) for the outer wezterm terminal so 24-bit color and
# undercurls pass through.
set -g default-terminal "tmux-256color"
set -as terminal-features ",wezterm:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
#-------------------------------------------------------------------------------
#  Terminal settings {{{1
#-------------------------------------------------------------------------------
# -> https://github.com/alacritty/alacritty/issues/1628
# References:
#   * https://github.com/neovim/neovim/pull/9097
#   * https://github.com/tmux/tmux/issues/1492
# Allow undercurls for terminals that support them.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Allow coloured undercurls for terminals that support them.
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# kitty graphics protocol
set -gq allow-passthrough on
# Let tmux set the system clipboard via OSC 52 (works over SSH and in
# modern terminals: WezTerm, Kitty, Ghostty, Alacritty).
set -g set-clipboard on
# }}}
#-------------------------------------------------------------------------------
#  Prefix {{{1
#-------------------------------------------------------------------------------
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

bind a last-window

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
# super useful when using "grouped sessions" and multi-monitor setup
set-option -wg aggressive-resize on
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g history-limit 100000
set-option -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind . next-layout

bind z resize-pane -Z
# }}}
#-------------------------------------------------------------------------------
#  Display {{{1
#-------------------------------------------------------------------------------
set-option -g set-titles on
set-option -g set-titles-string '❐ #S ● #I'
set-option -g allow-rename on
set-option -g pane-base-index 1
set-option -g base-index 1
set-option -g monitor-activity on
set-option -sg repeat-time 600
set-option -g display-time 1000
set-option -wg automatic-rename on
# When a window auto-renames, show a folder marker + the current directory's
# basename while the pane sits at an (idle) zsh prompt, and the running
# command's name otherwise. Restores "blank shell => directory" tab labels
# instead of a bare "zsh". (#W is what window-status-*-format renders.)
set-option -wg automatic-rename-format "#{?#{m:*zsh,#{pane_current_command}}, #{b:pane_current_path},#{pane_current_command}}"
set-option -g visual-activity off
# }}}
#-------------------------------------------------------------------------------
#  Navigation {{{1
#-------------------------------------------------------------------------------
set-option -g mouse on

bind C-f command-prompt -p find-session 'switch-client -t %%' # find session
bind-key C-g display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# New window and splits open in the current pane's working directory
bind c new-window -c '#{pane_current_path}'
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

setw -g mode-keys vi # set vi mode for copy mode
# more settings to make copy-mode more vim-like
bind Escape copy-mode
# setup 'v' to begin selection as in Vim
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Route all copies through the portable backend resolver (~/.tmux/yank.sh),
# which selects pbcopy / reattach (macOS), wl-copy (Wayland), xsel/xclip (X11),
# clip.exe (WSL), or OSC-52 (SSH/headless) at runtime. POSIX-safe: no bashisms.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.tmux/yank.sh"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.tmux/yank.sh"

# Synchronize all panes in a window
bind y setw synchronize-panes
# easier and faster switching between next/prev window
bind p previous-window
bind n next-window

# detach client
bind-key d detach
bind-key C-d detach

# Cycle to next pane
bind-key -r Tab select-pane -t :.+

# previous window
bind-key BSpace previous-window

# swap panes
bind-key -r J swap-pane -D
bind-key -r K swap-pane -U

unbind -T copy-mode-vi MouseDragEnd1Pane
# }}}
#-------------------------------------------------------------------------------
#  Status Bar {{{1
#-------------------------------------------------------------------------------
bind-key b set-option status

INACTIVE_FG_COLOR='#{@thm_overlay_0}'

set-option -g status on
set-option -g status-position bottom
set-option -g status-justify centre
set-option -g status-interval 1

# NOTE: these use nested conditionals and "," and "}" must be escaped
search_icon="#{?window_active,#{?window_zoomed_flag,#[fg=#{@thm_blue}],},} "
pane_count="#[default]#{?window_active,#[fg=$INACTIVE_FG_COLOR](#{window_panes}),}"
status_items="#[default]#{?window_bell_flag,#[fg=#{@thm_red}] ,}$pane_count $search_icon"

# see: https://github.com/tmux-plugins/tmux-battery
set -g @batt_icon_status_charged ''
set -g @batt_icon_status_attached ''
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_discharging ''
set -g @batt_remain_short 'true'

battery="#{battery_color_fg}#[bg=default]#{battery_icon_status}"

set -g status-left-length  80
set -g status-right-length 70
# Options -> ⧉ ❐
set -g status-left "#[fg=#{@thm_mauve},bg=default]#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] ❐ #S #[fg=#{@thm_mauve},bg=default,nobold]#[default]"
# alternate date format "%a %d %b"
right_sep="#[default,dim,fg=#{@thm_surface_1}]•"
set -g status-right "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] %A, %d %b #[fg=#{@thm_blue},bold]%H:%M #[fg=#{@thm_surface_0},bg=default]#[default] $battery "

# }}}
#-------------------------------------------------------------------------------
#  Pane border {{{1
#-------------------------------------------------------------------------------
# Pane borders are themed by Catppuccin (Macchiato). Previous hardcoded values:
# set-option -g pane-active-border-style fg=colour51
# set-option -g pane-border-style        fg='#343d46'
# }}}

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# List of plugins
# Supports `github_username/repo` or full git repo URLs
#-------------------------------------------------------------------------------
#  Plugins {{{1
#-------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sessionist'
#-------------------------------------------------------------------------------
# Saves and restores tmux sessions beyond system crashes and restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Auto saves tmux environment and keeps tmux running
set -g @plugin 'tmux-plugins/tmux-continuum'
# Auto-restore is OFF on purpose: continuum keeps auto-saving so a snapshot
# always exists, but nothing is restored on boot. Resume is opt-in and
# name-scoped via `tmx` (~/.local/bin/tmx): reuse a saved session's exact
# name, pick its "resume" entry in the picker, or run `tmx -r <name>`.
set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'
#-------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
#-------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-open'
#-------------------------------------------------------------------------------
# which-key style popup menu for discoverability (prefix+Space / Ctrl+Space)
set -g @plugin 'alexwforsythe/tmux-which-key'
#-------------------------------------------------------------------------------
# Highlights the status bar when the prefix key is pressed (also Copy/Sync modes)
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
#-------------------------------------------------------------------------------
# Catppuccin (Macchiato), palette-only. Exports #{@thm_*}, used to recolour the
# custom status line in the re-assert block at the very bottom (after TPM init).
# Also themes pane borders, popups, menu and clock.
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_status_background 'none'
# The centred window list is hand-rolled as rounded pills in the recolour
# block below (after TPM init). Tell Catppuccin NOT to render the window list
# so it doesn't set competing window-status formats/styles.
set -g @catppuccin_window_status_style 'none'
#-------------------------------------------------------------------------------
# smart-splits.nvim is managed by Neovim (lazy.nvim). Do NOT load it via TPM —
# its smart-splits.tmux re-binds C-h/j/k/l + M-h/j/k/l with the un-hardened
# '#{@pane-is-vim}' condition, which overrides the resilient binds below
# (see the hardened bindings at ~L227-242).
# set -g @plugin 'mrjones2014/smart-splits.nvim'
# '@pane-is-vim' is a pane-local option that is set by the plugin on load,
# and unset when Neovim exits or suspends; note that this means you'll probably
# not want to lazy-load smart-splits.nvim, as the variable won't be set until
# the plugin is loaded

# Smart pane switching with awareness of Neovim splits.
bind-key -n C-h if -F "#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}" 'send-keys C-l'  'select-pane -R'

# Alternatively, if you want to disable wrapping when moving in non-neovim panes, use these bindings
# bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{pane_at_left}'   '' 'select-pane -L' }
# bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
# bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{pane_at_top}'    '' 'select-pane -U' }
# bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{pane_at_right}'  '' 'select-pane -R' }

# Smart pane resizing with awareness of Neovim splits.
bind-key -n M-h if -F "#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if -F "#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if -F "#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if -F "#{&&:#{@pane-is-vim},#{m:*vim*,#{pane_current_command}}}" 'send-keys M-l' 'resize-pane -R 3'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if -F \"#{@pane-is-vim}\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# renew environment
# -------------------------------------
set -g update-environment \
  "DISPLAY\
  SSH_ASKPASS\
  SSH_AUTH_SOCK\
  SSH_AGENT_PID\
  SSH_CONNECTION\
  SSH_TTY\
  WINDOWID\
  XAUTHORITY"

bind '$' run "~/.tmux/renew_env.sh"

# Session is considered to be remote when we ssh into host
if-shell 'test -n "$SSH_CLIENT"' \
    'source-file ~/.tmux/tmux.remote.conf'

# Initializes TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
run-shell '~/.tmux/plugins/tpm/tpm'

#-------------------------------------------------------------------------------
#  Catppuccin (Macchiato) recolour of the custom status line {{{1
#-------------------------------------------------------------------------------
# TPM (above) runs catppuccin last, overwriting status/window/message/mode
# styles. Re-assert the custom bar here so it wins, recoloured with the Macchiato
# palette (#{@thm_*}, exported by the plugin). Layout, centring, icons, battery
# and prefix badges are unchanged — only colours are themed.
# NOTE: #{@thm_*} exist only after the catppuccin plugin is installed
# (prefix + I) and TPM has sourced it; before that these lines are harmless.

# transparent status background (as before)
set -g status-style "fg=terminal,bg=terminal"

# Window list — one independent rounded pill per window (centred by
# status-justify above; pills separated by one transparent cell).
#   caps: fg = pill bg, bg = status bg  -> the cap glyph paints the pill's
#   rounded end in the pill colour over the transparent bar (never a crescent).
#   body: fg = text colour, bg = pill bg. inactive = surface_0 / subtext_1;
#   active = mauve / crust (bold). Flag icons (zoom/activity/bell) are
#   inlined as #{?flag,#{E:@catppuccin_window_flags_icon_*},} in the final
#   format strings so they evaluate per draw (a nested #{@opt} would not).
set -wg window-status-activity-style "none"
set -wg window-status-separator " "
set -wg window-status-format "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_subtext_1},bg=#{@thm_surface_0}] #I  #W#{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},}#{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}#{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},} #[fg=#{@thm_surface_0},bg=default]#[default]"
set -wg window-status-current-format "#[fg=#{@thm_mauve},bg=default]#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] #I  #W (#{window_panes})#{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},}#{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}#{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},} #[fg=#{@thm_mauve},bg=default,nobold]#[default]"

# command line + copy-mode selection
set -gF message-style         "fg=#{@thm_yellow},bg=terminal,bold"
set -gF message-command-style "fg=#{@thm_green},bg=terminal,bold,blink"
set -gF mode-style            "bg=#{@thm_surface_0},fg=#{@thm_green},bold"

# State pill after the session pill: prefix (^A) / Copy / Sync, same rounded
# capsule geometry as the session/window pills. Native conditionals replace
# #{prefix_highlight}; precedence client_prefix > pane_in_mode > synchronize-panes.
# Pills are stored as options and expanded via #{E:@opt} so the commas inside
# #[fg=..,bg=..] don't break #{?...} parsing. Each visible branch and the else
# branch are 9 cells wide (1 sep + [cap][ 4-wide label ][cap]) so status-left
# width is constant and the centred window list never shifts.
set -g @_state_prefix "#[fg=#{@thm_sapphire},bg=default]#[fg=#{@thm_crust},bg=#{@thm_sapphire},bold]  ^A  #[fg=#{@thm_sapphire},bg=default,nobold]#[default]"
set -g @_state_copy "#[fg=#{@thm_peach},bg=default]#[fg=#{@thm_crust},bg=#{@thm_peach},bold] Copy #[fg=#{@thm_peach},bg=default,nobold]#[default]"
set -g @_state_sync "#[fg=#{@thm_green},bg=default]#[fg=#{@thm_crust},bg=#{@thm_green},bold] Sync #[fg=#{@thm_green},bg=default,nobold]#[default]"
set -ga status-left "#{?client_prefix, #{E:@_state_prefix},#{?pane_in_mode, #{E:@_state_copy},#{?synchronize-panes, #{E:@_state_sync},         }}}"
