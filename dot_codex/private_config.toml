# ~/.codex/config.toml (chezmoi source: dot_codex/private_config.toml)
#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6-astra"
model_reasoning_effort = "ultra"
model_verbosity = "medium"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

file_opener = "vscode"

project_root_markers = [".git", ".hg", ".sl"]
project_doc_max_bytes = 65536
project_doc_fallback_filenames = [
  "AGENTS.md",
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "README.md",
]

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = [
  "*TOKEN*",
  "*SECRET*",
  "*KEY*",
  "*PASSWORD*",
  "AWS_*",
  "AZURE_*",
  "OP_SESSION_*",
  "OP_*",
  "GITHUB_TOKEN",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "OPENROUTER_API_KEY",
]
include_only = [
  "PATH",
  "HOME",
  "USER",
  "SHELL",
  "TERM",
  "TMPDIR",
  "LANG",
  "LC_ALL",
  "EDITOR",
  "VISUAL",
  "GOPATH",
  "GOROOT",
  "GOMODCACHE",
  "GONOPROXY",
  "GONOSUMDB",
  "GOPRIVATE",
  "CARGO_HOME",
  "RUSTUP_HOME",
  "MISE_DATA_DIR",
  "MISE_CONFIG_DIR",
  "MISE_CACHE_DIR",
  "XDG_CONFIG_HOME",
  "XDG_DATA_HOME",
  "XDG_CACHE_HOME",
]

[sandbox_workspace_write]
network_access = false
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[features]
goals = true
plugin_hooks = true
plugins = true
hooks = true
multi_agent = true
shell_snapshot = true
shell_tool = true
unified_exec = true
fast_mode = true
undo = true
memories = true
codex_git_commit = false
apps = true
js_repl = false
chronicle = false

[tui]
notifications = true
notification_method = "auto"
notification_condition = "unfocused"
alternate_screen = "never"
show_tooltips = false
animations = false

[tui.model_availability_nux]
"gpt-5.5" = 2

[analytics]
enabled = false

[feedback]
enabled = false

[history]
max_bytes = 104857600

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_PROSE"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
show-ultra-in-model-picker-slider = false
show-context-window-usage = true
composerEnterBehavior = "cmdAlways"
hotkey-window-projectless-default-enabled = true
appearanceLightCodeThemeId = "catppuccin"
appearanceDarkCodeThemeId = "tokyo-night"
usePointerCursors = false
dock-icon-preference = "codex-system"

[desktop.appearanceLightChromeTheme]
accent = "#8839ef"
contrast = 45
ink = "#4c4f69"
opaqueWindows = false
surface = "#eff1f5"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#40a02b"
diffRemoved = "#d20f39"
skill = "#8839ef"

[desktop.appearanceDarkChromeTheme]
accent = "#3d59a1"
contrast = 60
ink = "#a9b1d6"
opaqueWindows = false
surface = "#1a1b26"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#449dab"
diffRemoved = "#914c54"
skill = "#9d7cd8"

[plugins."sites@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[memories]
generate_memories = true
use_memories = true

[features.multi_agent_v2]
max_concurrent_threads_per_session = 16

[plugins."unified-computer-use@openai-bundled"]
enabled = true
