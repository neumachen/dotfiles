# The Tokyo Night Storm Shiki theme is NOT an external. It is vendored at
# MeinCodex/Notizen/Obsidian/Main/dot_obsidian/shiki-themes/tokyo-night-storm.json
# (target ~/MeinCodex/Notizen/Obsidian/Main/.obsidian/shiki-themes/tokyo-night-storm.json).
#
# It used to be fetched from enkia/tokyo-night-vscode-theme with
# filter.command = "python3" to strip the upstream JSONC comments. On a fresh
# Mac /usr/bin/python3 is a Command Line Tools shim, so the filter died with
# "xcrun: error: invalid active developer path" and aborted the whole apply --
# before CLT (and therefore a real python3) had been installed. Vendoring the
# already-stripped strict JSON removes that bootstrap-order dependency.
# Re-vendor by hand if the upstream theme changes.
